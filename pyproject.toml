[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-atlas"
version = "0.1.0"
description = "Model-agnostic inside-the-model analysis and derivative-building platform: tensor census, streamed REAP atlas, keep-map planning, conversion, repair, serving. Kimi K3 is the first registered subject."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "model-atlas contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
model-atlas = "model_atlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/model_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["model_atlas"]
mypy_path = "src"
